spring.application.name=linha-fina
server.port=${PORT:8080}
server.address=0.0.0.0
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.servlet.session.timeout=8h

# Carrega credenciais de backend/.env quando esse arquivo existir.
spring.config.import=optional:file:./.env[.properties]
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/linhafina}
spring.datasource.username=${DB_USERNAME:linhafina}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jackson.serialization.write-dates-as-timestamps=false
spring.servlet.encoding.charset=UTF-8
spring.servlet.encoding.force=true
