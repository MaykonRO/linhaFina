spring.application.name=linha-fina
server.port=8080
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=false
server.servlet.session.timeout=8h

# Carrega credenciais de backend/.env quando esse arquivo existir.
spring.config.import=optional:file:./.env[.properties]
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/linhafina}
spring.datasource.username=${DB_USERNAME:linhafina}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jackson.serialization.write-dates-as-timestamps=false
spring.servlet.encoding.charset=UTF-8
spring.servlet.encoding.force=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

atelie.capacidade-horas-dia=${ATELIE_CAPACIDADE_HORAS_DIA:8}
atelie.taxa-urgencia-padrao=${ATELIE_TAXA_URGENCIA_PADRAO:20}
atelie.bloqueio-pendencias=${ATELIE_BLOQUEIO_PENDENCIAS:false}
atelie.taxa-guarda-dia=${ATELIE_TAXA_GUARDA_DIA:5}
atelie.dias-tolerancia-retirada=${ATELIE_DIAS_TOLERANCIA_RETIRADA:2}
