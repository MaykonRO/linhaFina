previews:
  generation: off

services:
  - type: web
    name: linha-fina-api
    runtime: docker
    repo: https://github.com/MaykonRO/linhaFina
    branch: main
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/configuracoes
    envVars:
      - key: DB_URL
        value: jdbc:postgresql://dpg-dc2c2vifngtc73bepv7g-a:5432/linhafina
      - key: DB_USERNAME
        fromDatabase:
          name: linha-fina-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: linha-fina-db
          property: password
      - key: APP_ADMIN_EMAIL
        value: admin@linhafina.local
      - key: APP_ADMIN_PASSWORD
        generateValue: true
      - key: APP_ADMIN_NAME
        value: Administracao Render
      - key: APP_CORS_ORIGINS
        value: https://linha-fina-web.onrender.com
      - key: COOKIE_SECURE
        value: "true"
      - key: SERVER_SERVLET_SESSION_COOKIE_SAME_SITE
        value: None
      - key: ATELIE_UPLOAD_DIRETORIO
        value: /app/uploads

  - type: web
    name: linha-fina-web
    runtime: static
    repo: https://github.com/MaykonRO/linhaFina
    branch: main
    buildCommand: echo "Frontend estatico, sem etapa de build"
    staticPublishPath: front

databases:
  - name: linha-fina-db
    databaseName: linhafina
    user: linhafina
    plan: free
